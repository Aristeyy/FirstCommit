version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: monthly
    groups:
      backend-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /miniapp
    schedule:
      interval: monthly
    groups:
      miniapp-minor:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/backend, /miniapp]
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
